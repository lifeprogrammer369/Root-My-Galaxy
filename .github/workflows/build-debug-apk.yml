name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          if sdkmanager --install "platforms;android-37"; then
            echo "GRADLE_SDK_FLAGS=" >> "$GITHUB_ENV"
          elif sdkmanager --channel=3 --install "platforms;android-Baklava"; then
            echo "GRADLE_SDK_FLAGS=-PCI_COMPILE_SDK_PREVIEW=Baklava" >> "$GITHUB_ENV"
          else
            echo "No API 37+ platform package available on this runner" >&2
            sdkmanager --list | sed -n '1,200p'
            exit 1
          fi

          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug $GRADLE_SDK_FLAGS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error